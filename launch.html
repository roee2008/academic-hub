<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launching Studio App...</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 420px;
    }
    h2 { margin-top: 0; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .loader {
      margin: 1.5rem auto;
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    a.button {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      background: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    a.button:hover { background: #0369a1; }
  </style>
  <script>
    // Trigger the Windows custom protocol to start the servers
    window.location.href = "studio://run";

    // Auto redirect to the app after 2 seconds
    setTimeout(() => {
      window.location.href = "http://localhost:5173";
    }, 2000);
  </script>
</head>
<body>
  <div class="card">
    <div class="loader"></div>
    <h2>Starting Studio...</h2>
    <p>Launching backend & frontend servers, redirecting to your app in a moment.</p>
    <a href="http://localhost:5173" class="button">Go to App (localhost:5173)</a>
  </div>
</body>
</html>
